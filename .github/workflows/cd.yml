name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1

jobs:
  publish-evidence:
    name: record-pipeline-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write pipeline evidence artifact
        run: |
          mkdir -p sbom
          cat > sbom/pipeline-evidence.json <<EOF
          {
            "source": "live",
            "git_sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_name": "${GITHUB_WORKFLOW}",
            "workflow_result": "in_progress",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: sbom/pipeline-evidence.json

  deploy:
    name: aws-oidc-deploy
    runs-on: ubuntu-latest
    needs: [publish-evidence]
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prove OIDC assumption
        id: oidc
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          echo "caller_arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "$ARN" | grep -q 'assumed-role/cloudops-prod-github-deploy/'
      - uses: docker/setup-buildx-action@v3
      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Lambda image
        env:
          ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          test -n "$ECR_URL"
          docker build --target lambda -t "$ECR_URL:sha-${GITHUB_SHA}" .
          docker image inspect "$ECR_URL:sha-${GITHUB_SHA}" --format 'os={{.Os}} arch={{.Architecture}} user={{.Config.User}} cmd={{json .Config.Cmd}}'
      - name: Trivy Lambda image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ECR_REPOSITORY_URL }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          output: trivy-lambda.txt
          ignore-unfixed: true
      - name: Fail on unfixed CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ECR_REPOSITORY_URL }}:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Syft SBOM for Lambda image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.ECR_REPOSITORY_URL }}:sha-${{ github.sha }}
          format: spdx-json
          artifact-name: cloudops-lambda-sbom.spdx.json
      - name: Push immutable image and record digest
        env:
          ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          docker push "$ECR_URL:sha-${GITHUB_SHA}"
          DIGEST="$(aws ecr describe-images \
            --repository-name cloudops-prod-api \
            --image-ids imageTag="sha-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test -n "$DIGEST"
          test "$DIGEST" != "None"
          echo "IMAGE_URI=${ECR_URL}@${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          mkdir -p sbom
          cat > sbom/ecr-image-evidence.json <<EOF
          {
            "source": "live",
            "git_sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_name": "${GITHUB_WORKFLOW}",
            "image_repository": "cloudops-prod-api",
            "image_tag": "sha-${GITHUB_SHA}",
            "image_digest": "${DIGEST}",
            "image_uri": "${ECR_URL}@${DIGEST}",
            "oidc_caller_arn": "${{ steps.oidc.outputs.caller_arn }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ecr-image-evidence
          path: |
            sbom/ecr-image-evidence.json
            trivy-lambda.txt
      - uses: sigstore/cosign-installer@v3
      - name: Cosign keyless sign
        id: cosign
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_URI}"
          cosign verify \
            --certificate-identity-regexp 'https://github.com/Adellaghmari/cloudops-release-intelligence/.github/workflows/cd.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_URI}"
      - name: Record Cosign status
        run: |
          echo "cosign_outcome=${{ steps.cosign.outcome }}" >> "$GITHUB_ENV"
          echo "cosign_outcome=${{ steps.cosign.outcome }}" >> sbom/ecr-image-evidence.json.tmp || true
      - name: Terraform apply image
        if: vars.ENABLE_TERRAFORM_APPLY == 'true'
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init
          terraform apply -auto-approve -var="api_image_uri=${IMAGE_URI}"
      - name: Skip GitHub terraform apply while state is local
        if: vars.ENABLE_TERRAFORM_APPLY != 'true'
        run: echo "Terraform apply remains disabled. State is local. Image ${IMAGE_URI} is ready for a reviewed local plan."
      - name: Post live evidence
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "PUBLIC_API_URL not set; skip dogfood ingest"
            exit 0
          fi
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS -X POST "${API_URL}/api/v1/events" \
            -H "content-type: application/json" \
            -d "{\"event_id\":\"evt_gha_${GITHUB_RUN_ID}\",\"event_type\":\"ci.run.completed\",\"occurred_at\":\"${NOW}\",\"source\":\"github-actions\",\"schema_version\":\"1.0\",\"service_id\":\"cloudops-api\",\"payload\":{\"git_sha\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\",\"workflow_run_id\":\"${GITHUB_RUN_ID}\",\"workflow_name\":\"${GITHUB_WORKFLOW}\",\"workflow_result\":\"success\",\"image_digest\":\"${IMAGE_DIGEST:-}\"}}"
