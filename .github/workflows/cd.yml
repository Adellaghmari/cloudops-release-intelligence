name: protected-release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact approved main commit SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  ECR_URL: 912415493331.dkr.ecr.eu-west-1.amazonaws.com/cloudops-prod-api
  WEB_BUCKET: cloudops-prod-web-7be25877
  CLOUDFRONT_DISTRIBUTION_ID: E2220NQVG6GU75
  TERRAFORM_APPLY_ROLE_ARN: arn:aws:iam::912415493331:role/cloudops-prod-terraform-apply
  TF_VAR_budget_notification_email: ${{ secrets.TF_VAR_BUDGET_NOTIFICATION_EMAIL }}
  TF_VAR_terraform_state_bucket_arn: ${{ vars.TF_VAR_TERRAFORM_STATE_BUCKET_ARN }}
  TF_VAR_terraform_state_bucket_name: ${{ vars.TF_VAR_TERRAFORM_STATE_BUCKET_NAME }}
  TF_VAR_terraform_state_key: ${{ vars.TF_VAR_TERRAFORM_STATE_KEY }}

jobs:
  source:
    name: Verify approved main source
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed outside approved release context
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ENABLE_TERRAFORM_APPLY: ${{ vars.ENABLE_TERRAFORM_APPLY }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "$SOURCE_SHA"
          test "$SOURCE_SHA" = "${GITHUB_SHA}"
          test "$ENABLE_TERRAFORM_APPLY" = "true"
          test -n "${TF_VAR_budget_notification_email:-}"
          test -n "${TF_VAR_terraform_state_bucket_arn:-}"
          test -n "${TF_VAR_terraform_state_bucket_name:-}"
          test -n "${TF_VAR_terraform_state_key:-}"

  candidate:
    name: Build immutable candidate
    runs-on: ubuntu-latest
    needs: [source]
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image_uri: ${{ steps.publish.outputs.image_uri }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: candidate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          inline-session-policy: >-
            {
              "Version":"2012-10-17",
              "Statement":[
                {
                  "Effect":"Allow",
                  "Action":"ecr:GetAuthorizationToken",
                  "Resource":"*"
                },
                {
                  "Effect":"Allow",
                  "Action":[
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:BatchGetImage",
                    "ecr:CompleteLayerUpload",
                    "ecr:DescribeImages",
                    "ecr:DescribeRepositories",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:InitiateLayerUpload",
                    "ecr:PutImage",
                    "ecr:UploadLayerPart"
                  ],
                  "Resource":"arn:aws:ecr:eu-west-1:912415493331:repository/cloudops-prod-api"
                }
              ]
            }
      - name: Prove candidate publisher identity
        id: oidc
        run: |
          set -euo pipefail
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          echo "$caller" | grep -q 'assumed-role/cloudops-prod-github-deploy/'
          echo "caller_arn=$caller" >> "$GITHUB_OUTPUT"
      - name: Resolve existing candidate
        id: existing
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          digest="$(aws ecr batch-get-image \
            --repository-name cloudops-prod-api \
            --image-ids imageTag="$tag" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Build candidate once
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          docker build \
            --target lambda \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${ECR_URL}:sha-${GITHUB_SHA}" \
            .
          docker image inspect "${ECR_URL}:sha-${GITHUB_SHA}" \
            --format 'os={{.Os}} arch={{.Architecture}} user={{.Config.User}} entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}}'
      - name: Pull existing immutable candidate
        if: steps.existing.outputs.exists == 'true'
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${ECR_URL}@${EXISTING_DIGEST}"
          docker tag "${ECR_URL}@${EXISTING_DIGEST}" "${ECR_URL}:sha-${GITHUB_SHA}"
      - name: Verify candidate source identity
        run: |
          set -euo pipefail
          revision="$(docker image inspect "${ECR_URL}:sha-${GITHUB_SHA}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = "$GITHUB_SHA"
      - name: Prove Lambda image contract
        run: bash scripts/ci/lambda-image-proof.sh "${ECR_URL}:sha-${GITHUB_SHA}"
      - name: Scan candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_URL }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          output: trivy-lambda.txt
          ignore-unfixed: true
      - name: Block unfixed critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.ECR_URL }}:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate candidate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.ECR_URL }}:sha-${{ github.sha }}
          format: spdx-json
          artifact-name: cloudops-lambda-sbom.spdx.json
      - name: Publish candidate and resolve digest
        id: publish
        env:
          CANDIDATE_EXISTS: ${{ steps.existing.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          OIDC_CALLER_ARN: ${{ steps.oidc.outputs.caller_arn }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          if [ "$CANDIDATE_EXISTS" = "true" ]; then
            digest="$EXISTING_DIGEST"
          else
            docker push "${ECR_URL}:${tag}"
            digest="$(aws ecr describe-images \
              --repository-name cloudops-prod-api \
              --image-ids imageTag="$tag" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_uri="${ECR_URL}@${digest}"
          mkdir -p release
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg repository "$ECR_URL" \
            --arg tag "$tag" \
            --arg digest "$digest" \
            --arg image_uri "$image_uri" \
            --arg caller_arn "$OIDC_CALLER_ARN" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              source_sha: $source_sha,
              workflow_run_id: $workflow_run_id,
              repository: $repository,
              tag: $tag,
              digest: $digest,
              image_uri: $image_uri,
              caller_arn: $caller_arn,
              created_at: $created_at
            }' > release/candidate.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.run_id }}
          path: |
            release/candidate.json
            trivy-lambda.txt
          retention-days: 7
          if-no-files-found: error
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign candidate
        id: cosign
        continue-on-error: true
        env:
          IMAGE_URI: ${{ steps.publish.outputs.image_uri }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_URI"
          cosign verify \
            --certificate-identity-regexp 'https://github.com/Adellaghmari/cloudops-release-intelligence/.github/workflows/cd.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_URI"
      - name: Record optional signing result
        run: echo "Cosign outcome ${{ steps.cosign.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Plan release
    runs-on: ubuntu-latest
    needs: [source, candidate]
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      config_tree: ${{ steps.metadata.outputs.config_tree }}
      plan_sha256: ${{ steps.metadata.outputs.plan_sha256 }}
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_api_image_uri: ${{ needs.candidate.outputs.image_uri }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: release-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Prove plan role identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text \
            | grep -q 'assumed-role/cloudops-prod-github-plan/'
      - name: Create exact release plan
        run: |
          set -euo pipefail
          [[ "${TF_VAR_api_image_uri}" =~ @sha256:[0-9a-f]{64}$ ]]
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -lock=true -out=tfplan
          terraform show -json tfplan > "${RUNNER_TEMP}/release-plan.json"
          python3 ../scripts/ci/terraform-plan-guard.py \
            "${RUNNER_TEMP}/release-plan.json" \
            --summary-json release-plan-summary.json \
            --summary-markdown release-plan-summary.md \
            --expected-image-uri "${TF_VAR_api_image_uri}"
          cat release-plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          rm -f "${RUNNER_TEMP}/release-plan.json"
      - name: Bind plan identity
        id: metadata
        env:
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
          CANDIDATE_IMAGE_URI: ${{ needs.candidate.outputs.image_uri }}
        run: |
          set -euo pipefail
          plan_sha256="$(sha256sum tfplan | awk '{print $1}')"
          config_tree="$(git rev-parse "${GITHUB_SHA}:infra")"
          artifact_name="release-plan-${GITHUB_RUN_ID}"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg candidate_digest "$CANDIDATE_DIGEST" \
            --arg candidate_image_uri "$CANDIDATE_IMAGE_URI" \
            --arg terraform_version "1.10.5" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg config_tree "$config_tree" \
            --arg backend_bucket "cloudops-prod-tfstate-7d9fdd77" \
            --arg state_key "cloudops-release-intelligence/prod/terraform.tfstate" \
            --arg plan_sha256 "$plan_sha256" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              source_sha: $source_sha,
              candidate_digest: $candidate_digest,
              candidate_image_uri: $candidate_image_uri,
              terraform_version: $terraform_version,
              workflow_run_id: $workflow_run_id,
              workflow_ref: $workflow_ref,
              config_tree: $config_tree,
              backend_bucket: $backend_bucket,
              state_key: $state_key,
              plan_sha256: $plan_sha256,
              created_at: $created_at
            }' > release-metadata.json
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "config_tree=$config_tree" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=$plan_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload reviewed plan artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            infra/tfplan
            infra/release-metadata.json
            infra/release-plan-summary.json
            infra/release-plan-summary.md
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply exact reviewed plan
    runs-on: ubuntu-latest
    needs: [source, candidate, plan]
    environment: prod
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      api_endpoint: ${{ steps.release_outputs.outputs.api_endpoint }}
      cloudfront_domain: ${{ steps.release_outputs.outputs.cloudfront_domain }}
      evidence_role_arn: ${{ steps.release_outputs.outputs.evidence_role_arn }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Download plan from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: infra
      - name: Verify exact plan identity and safety
        env:
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
          CANDIDATE_IMAGE_URI: ${{ needs.candidate.outputs.image_uri }}
          EXPECTED_CONFIG_TREE: ${{ needs.plan.outputs.config_tree }}
          EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          test -f tfplan
          test -f release-metadata.json
          test -n "$EXPECTED_ARTIFACT_DIGEST"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(jq -r .source_sha release-metadata.json)" = "$GITHUB_SHA"
          test "$(jq -r .candidate_digest release-metadata.json)" = "$CANDIDATE_DIGEST"
          test "$(jq -r .candidate_image_uri release-metadata.json)" = "$CANDIDATE_IMAGE_URI"
          test "$(jq -r .terraform_version release-metadata.json)" = "1.10.5"
          test "$(jq -r .workflow_run_id release-metadata.json)" = "$GITHUB_RUN_ID"
          test "$(jq -r .workflow_ref release-metadata.json)" = "$GITHUB_WORKFLOW_REF"
          test "$(jq -r .config_tree release-metadata.json)" = "$EXPECTED_CONFIG_TREE"
          test "$EXPECTED_CONFIG_TREE" = "$(git rev-parse "${GITHUB_SHA}:infra")"
          test "$(jq -r .backend_bucket release-metadata.json)" = "cloudops-prod-tfstate-7d9fdd77"
          test "$(jq -r .state_key release-metadata.json)" = "cloudops-release-intelligence/prod/terraform.tfstate"
          test "$(jq -r .plan_sha256 release-metadata.json)" = "$EXPECTED_PLAN_SHA256"
          test "$EXPECTED_PLAN_SHA256" = "$(sha256sum tfplan | awk '{print $1}')"
          terraform show -json tfplan > "${RUNNER_TEMP}/apply-plan.json"
          python3 ../scripts/ci/terraform-plan-guard.py \
            "${RUNNER_TEMP}/apply-plan.json" \
            --summary-json "${RUNNER_TEMP}/apply-summary.json" \
            --summary-markdown "${RUNNER_TEMP}/apply-summary.md" \
            --expected-image-uri "$CANDIDATE_IMAGE_URI"
          rm -f "${RUNNER_TEMP}/apply-plan.json"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: release-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Prove production Terraform identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text \
            | grep -q 'assumed-role/cloudops-prod-terraform-apply/'
      - name: Apply saved plan without recalculation
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure
          terraform apply -input=false tfplan
      - name: Export verified release outputs
        id: release_outputs
        run: |
          set -euo pipefail
          api_endpoint="$(terraform output -raw api_endpoint)"
          cloudfront_domain="$(terraform output -raw cloudfront_domain)"
          evidence_role_arn="$(terraform output -raw github_evidence_producer_role_arn)"
          [[ "$api_endpoint" =~ ^https://[^/?#]+$ ]]
          test -n "$cloudfront_domain"
          test "$evidence_role_arn" = "arn:aws:iam::912415493331:role/cloudops-prod-github-evidence-producer"
          echo "api_endpoint=$api_endpoint" >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=$cloudfront_domain" >> "$GITHUB_OUTPUT"
          echo "evidence_role_arn=$evidence_role_arn" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    needs: [candidate, apply]
    permissions:
      contents: read
      id-token: write
    outputs:
      frontend_bundle: ${{ steps.frontend.outputs.bundle }}
      invalidation_id: ${{ steps.invalidate.outputs.invalidation_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps
          npm run build -- --configuration=production
      - name: Validate frontend artifact
        id: frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          out="dist/frontend/browser"
          test -d "$out"
          if grep -R -n -E -i 'AKIA[0-9A-Z]{16}|aws_secret_access_key|BEGIN (RSA |EC )?PRIVATE KEY|localhost:8080' "$out"; then
            echo "Forbidden material found in production bundle"
            exit 1
          fi
          grep -R -n '8kci5uht3d.execute-api.eu-west-1.amazonaws.com' "$out" >/dev/null
          bundle=""
          for asset in "$out"/main-*.js; do
            bundle="$(basename "$asset")"
            break
          done
          test -n "$bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: application-release-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          inline-session-policy: >-
            {
              "Version":"2012-10-17",
              "Statement":[
                {
                  "Effect":"Allow",
                  "Action":["lambda:GetFunction","lambda:GetFunctionConfiguration"],
                  "Resource":[
                    "arn:aws:lambda:eu-west-1:912415493331:function:cloudops-prod-api",
                    "arn:aws:lambda:eu-west-1:912415493331:function:cloudops-prod-worker"
                  ]
                },
                {
                  "Effect":"Allow",
                  "Action":["s3:GetBucketLocation","s3:ListBucket"],
                  "Resource":"arn:aws:s3:::cloudops-prod-web-7be25877"
                },
                {
                  "Effect":"Allow",
                  "Action":["s3:DeleteObject","s3:GetObject","s3:PutObject"],
                  "Resource":"arn:aws:s3:::cloudops-prod-web-7be25877/*"
                },
                {
                  "Effect":"Allow",
                  "Action":["cloudfront:CreateInvalidation","cloudfront:GetDistribution","cloudfront:GetInvalidation"],
                  "Resource":"arn:aws:cloudfront::912415493331:distribution/E2220NQVG6GU75"
                }
              ]
            }
      - name: Verify Terraform deployed exact candidate
        env:
          CANDIDATE_IMAGE_URI: ${{ needs.candidate.outputs.image_uri }}
        run: |
          set -euo pipefail
          caller="$(aws sts get-caller-identity --query Arn --output text)"
          echo "$caller" | grep -q 'assumed-role/cloudops-prod-github-deploy/'
          for function_name in cloudops-prod-api cloudops-prod-worker; do
            resolved="$(aws lambda get-function \
              --function-name "$function_name" \
              --query 'Code.ResolvedImageUri' \
              --output text)"
            test "$resolved" = "$CANDIDATE_IMAGE_URI"
          done
      - name: Sync frontend to private S3
        working-directory: frontend
        run: |
          set -euo pipefail
          out="dist/frontend/browser"
          aws s3 sync "$out" "s3://${WEB_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$out/index.html" "s3://${WEB_BUCKET}/index.html" \
            --cache-control "public,max-age=60,must-revalidate" \
            --content-type "text/html"
      - name: Invalidate and wait for CloudFront
        id: invalidate
        run: |
          set -euo pipefail
          id="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$id"
          status="$(aws cloudfront get-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$id" \
            --query 'Invalidation.Status' \
            --output text)"
          test "$status" = "Completed"
          echo "invalidation_id=$id" >> "$GITHUB_OUTPUT"

  evidence:
    name: Publish authenticated evidence
    runs-on: ubuntu-latest
    needs: [candidate, apply, deploy]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Require producer identity from applied Terraform
        env:
          API_ENDPOINT: ${{ needs.apply.outputs.api_endpoint }}
          EVIDENCE_ROLE_ARN: ${{ needs.apply.outputs.evidence_role_arn }}
        run: |
          set -euo pipefail
          [[ "$API_ENDPOINT" =~ ^https://[^/?#]+$ ]]
          test "$EVIDENCE_ROLE_ARN" = "arn:aws:iam::912415493331:role/cloudops-prod-github-evidence-producer"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ needs.apply.outputs.evidence_role_arn }}
          role-session-name: evidence-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          unset-current-credentials: true
      - name: Prove evidence producer identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text \
            | grep -q 'assumed-role/cloudops-prod-github-evidence-producer/'
      - name: Post signed deployment evidence
        env:
          API_ENDPOINT: ${{ needs.apply.outputs.api_endpoint }}
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
          FRONTEND_BUNDLE: ${{ needs.deploy.outputs.frontend_bundle }}
          INVALIDATION_ID: ${{ needs.deploy.outputs.invalidation_id }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg event_id "evt_release_${GITHUB_RUN_ID}" \
            --arg occurred_at "$now" \
            --arg git_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg candidate_digest "$CANDIDATE_DIGEST" \
            --arg frontend_bundle "$FRONTEND_BUNDLE" \
            --arg invalidation_id "$INVALIDATION_ID" \
            '{
              event_id: $event_id,
              event_type: "ci.run.completed",
              occurred_at: $occurred_at,
              source: "github-actions",
              schema_version: "1.0",
              service_id: "cloudops-api",
              payload: {
                git_sha: $git_sha,
                branch: "main",
                workflow_run_id: $workflow_run_id,
                workflow_name: "protected-release",
                workflow_result: "success",
                candidate_digest: $candidate_digest,
                frontend_bundle: $frontend_bundle,
                invalidation_id: $invalidation_id
              }
            }' > "$RUNNER_TEMP/release-evidence.json"
          bash scripts/ci/post-signed-evidence.sh \
            "$API_ENDPOINT" \
            "$RUNNER_TEMP/release-evidence.json"

  verify:
    name: Verify release
    runs-on: ubuntu-latest
    needs: [candidate, apply, deploy, evidence]
    steps:
      - name: Verify public reads and deployed frontend
        env:
          API_ENDPOINT: ${{ needs.apply.outputs.api_endpoint }}
          CLOUDFRONT_DOMAIN: ${{ needs.apply.outputs.cloudfront_domain }}
          FRONTEND_BUNDLE: ${{ needs.deploy.outputs.frontend_bundle }}
        run: |
          set -euo pipefail
          for path in health ready status services releases; do
            curl --fail --silent --show-error "${API_ENDPOINT}/api/v1/${path}" >/dev/null
          done
          index="$(curl --fail --silent --show-error "https://${CLOUDFRONT_DOMAIN}/")"
          grep -q "$FRONTEND_BUNDLE" <<<"$index"
      - name: Verify anonymous mutations are denied
        env:
          API_ENDPOINT: ${{ needs.apply.outputs.api_endpoint }}
        run: |
          set -euo pipefail
          payload='{"event_id":"unsigned-release-check","event_type":"ci.run.completed","occurred_at":"2026-01-01T00:00:00Z","source":"unsigned-check","schema_version":"1.0","service_id":"cloudops-release","payload":{}}'
          for path in events demo/reset; do
            status="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/unsigned-${path//\//-}.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --data "$payload" \
              "${API_ENDPOINT}/api/v1/${path}")"
            case "$status" in
              401|403) ;;
              *) echo "Unsigned POST /api/v1/${path} returned ${status}"; exit 1 ;;
            esac
          done

  drift:
    name: Check zero Terraform drift
    runs-on: ubuntu-latest
    needs: [candidate, verify]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_api_image_uri: ${{ needs.candidate.outputs.image_uri }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: release-drift-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Require zero drift
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text \
            | grep -q 'assumed-role/cloudops-prod-github-plan/'
          terraform init -input=false
          set +e
          terraform plan -input=false -no-color -lock=true -detailed-exitcode
          plan_rc=$?
          set -e
          if [ "$plan_rc" -eq 2 ]; then
            echo "Unexpected Terraform drift after release"
            exit 1
          fi
          exit "$plan_rc"
