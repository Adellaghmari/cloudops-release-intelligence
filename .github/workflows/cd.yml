name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_lambda:
        description: Build and push Lambda image
        type: boolean
        default: false
      force_frontend:
        description: Deploy Angular SPA to S3/CloudFront
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  WEB_BUCKET: cloudops-prod-web-7be25877
  CLOUDFRONT_DISTRIBUTION_ID: E2220NQVG6GU75

jobs:
  changes:
    name: path-filter
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'lambda/**'
              - 'scripts/ci/lambda-image-proof.sh'
              - 'policies/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/cd.yml'

  publish-evidence:
    name: record-pipeline-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write pipeline evidence artifact
        run: |
          mkdir -p sbom
          cat > sbom/pipeline-evidence.json <<EOF
          {
            "source": "live",
            "git_sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_name": "${GITHUB_WORKFLOW}",
            "workflow_result": "in_progress",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: sbom/pipeline-evidence.json

  deploy:
    name: aws-oidc-deploy-lambda
    runs-on: ubuntu-latest
    needs: [publish-evidence, changes]
    if: >
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (needs.changes.outputs.backend == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.force_lambda))
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Show OIDC claims without printing the token
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, base64
          req_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(req_url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req) as resp:
              token = json.load(resp)["value"]
          payload = token.split(".")[1] + "=" * ((4 - len(token.split(".")[1]) % 4) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "ref", "job_workflow_ref"):
              print(f"{key}={claims.get(key)}")
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Prove OIDC assumption
        id: oidc
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          echo "caller_arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "$ARN" | grep -q 'assumed-role/cloudops-prod-github-deploy/'
      - uses: docker/setup-buildx-action@v3
      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Lambda image
        env:
          ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          test -n "$ECR_URL"
          docker build --target lambda -t "$ECR_URL:sha-${GITHUB_SHA}" .
          docker image inspect "$ECR_URL:sha-${GITHUB_SHA}" --format 'os={{.Os}} arch={{.Architecture}} user={{.Config.User}} entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}}'
      - name: Lambda bootstrap + RIE proof
        env:
          ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: bash scripts/ci/lambda-image-proof.sh "$ECR_URL:sha-${GITHUB_SHA}"
      - name: Trivy Lambda image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ECR_REPOSITORY_URL }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          format: table
          output: trivy-lambda.txt
          ignore-unfixed: true
      - name: Fail on unfixed CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ECR_REPOSITORY_URL }}:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Syft SBOM for Lambda image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.ECR_REPOSITORY_URL }}:sha-${{ github.sha }}
          format: spdx-json
          artifact-name: cloudops-lambda-sbom.spdx.json
      - name: Push immutable image and record digest
        env:
          ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          docker push "$ECR_URL:sha-${GITHUB_SHA}"
          DIGEST="$(aws ecr describe-images \
            --repository-name cloudops-prod-api \
            --image-ids imageTag="sha-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test -n "$DIGEST"
          test "$DIGEST" != "None"
          echo "IMAGE_URI=${ECR_URL}@${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          mkdir -p sbom
          cat > sbom/ecr-image-evidence.json <<EOF
          {
            "source": "live",
            "git_sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_name": "${GITHUB_WORKFLOW}",
            "image_repository": "cloudops-prod-api",
            "image_tag": "sha-${GITHUB_SHA}",
            "image_digest": "${DIGEST}",
            "image_uri": "${ECR_URL}@${DIGEST}",
            "oidc_caller_arn": "${{ steps.oidc.outputs.caller_arn }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ecr-image-evidence
          path: |
            sbom/ecr-image-evidence.json
            trivy-lambda.txt
      - uses: sigstore/cosign-installer@v3
      - name: Cosign keyless sign
        id: cosign
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_URI}"
          cosign verify \
            --certificate-identity-regexp 'https://github.com/Adellaghmari/cloudops-release-intelligence/.github/workflows/cd.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_URI}"
      - name: Record Cosign status
        run: |
          echo "cosign_outcome=${{ steps.cosign.outcome }}" >> "$GITHUB_ENV"
          echo "cosign_outcome=${{ steps.cosign.outcome }}" >> sbom/ecr-image-evidence.json.tmp || true
      - name: Terraform apply image
        if: vars.ENABLE_TERRAFORM_APPLY == 'true'
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init
          terraform apply -auto-approve -var="api_image_uri=${IMAGE_URI}"
      - name: Skip GitHub terraform apply while state is local
        if: vars.ENABLE_TERRAFORM_APPLY != 'true'
        run: echo "Terraform apply remains disabled. State is local. Image ${IMAGE_URI} is ready for a reviewed local plan."
      - name: Post live evidence
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "PUBLIC_API_URL not set; skip dogfood ingest"
            exit 0
          fi
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS -X POST "${API_URL}/api/v1/events" \
            -H "content-type: application/json" \
            -d "{\"event_id\":\"evt_gha_${GITHUB_RUN_ID}\",\"event_type\":\"ci.run.completed\",\"occurred_at\":\"${NOW}\",\"source\":\"github-actions\",\"schema_version\":\"1.0\",\"service_id\":\"cloudops-api\",\"payload\":{\"git_sha\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\",\"workflow_run_id\":\"${GITHUB_RUN_ID}\",\"workflow_name\":\"${GITHUB_WORKFLOW}\",\"workflow_result\":\"success\",\"image_digest\":\"${IMAGE_DIGEST:-}\"}}"

  deploy-frontend:
    name: aws-oidc-deploy-frontend
    runs-on: ubuntu-latest
    needs: [publish-evidence, changes]
    if: >
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (needs.changes.outputs.frontend == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.force_frontend))
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Production Angular build
        working-directory: frontend
        run: npm run build -- --configuration=production
      - name: Guard against secrets in bundle
        working-directory: frontend
        run: |
          set -euo pipefail
          OUT="dist/frontend/browser"
          test -d "$OUT"
          if grep -R -n -E -i 'AKIA[0-9A-Z]{16}|aws_secret_access_key|BEGIN (RSA |EC )?PRIVATE KEY|localhost:8080' "$OUT" ; then
            echo "Forbidden material found in production bundle"
            exit 1
          fi
          grep -R -n '8kci5uht3d.execute-api.eu-west-1.amazonaws.com' "$OUT" >/dev/null
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Prove OIDC assumption
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws sts get-caller-identity --query Arn --output text | grep -q 'assumed-role/cloudops-prod-github-deploy/'
      - name: Sync SPA to private S3 web bucket
        working-directory: frontend
        run: |
          set -euo pipefail
          OUT="dist/frontend/browser"
          # Hashed assets: long cache
          aws s3 sync "$OUT" "s3://${WEB_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          # index.html: short/no cache so SPA shell updates immediately
          aws s3 cp "$OUT/index.html" "s3://${WEB_BUCKET}/index.html" \
            --cache-control "public,max-age=60,must-revalidate" \
            --content-type "text/html"
      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          ID="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          echo "invalidation_id=$ID"
          # Waiter requires cloudfront:GetInvalidation (Phase 16A IAM plan; apply in 16B).
          if aws cloudfront get-invalidation \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --id "$ID" >/dev/null 2>&1; then
            aws cloudfront wait invalidation-completed \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --id "$ID"
            echo "invalidation_completed=$ID"
          else
            echo "::warning::GetInvalidation not yet granted on deploy role; invalidation $ID created without wait. Apply Phase 16B IAM hardening to enable the waiter."
          fi
      - name: Post frontend deploy live evidence
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "PUBLIC_API_URL not set; skip dogfood ingest"
            exit 0
          fi
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS -X POST "${API_URL}/api/v1/events" \
            -H "content-type: application/json" \
            -d "{\"event_id\":\"evt_fe_${GITHUB_RUN_ID}\",\"event_type\":\"ci.run.completed\",\"occurred_at\":\"${NOW}\",\"source\":\"github-actions\",\"schema_version\":\"1.0\",\"service_id\":\"cloudops-web\",\"payload\":{\"git_sha\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\",\"workflow_run_id\":\"${GITHUB_RUN_ID}\",\"workflow_name\":\"${GITHUB_WORKFLOW}\",\"workflow_result\":\"success\",\"surface\":\"frontend-cloudfront\",\"distribution_id\":\"${CLOUDFRONT_DISTRIBUTION_ID}\",\"web_bucket\":\"${WEB_BUCKET}\"}}"
