# GitHub Terraform plan/apply.
#
# PLAN: push/PR/workflow_dispatch when TERRAFORM_REMOTE_STATE_READY=true (same-repo only).
# APPLY: workflow_dispatch + apply=true + ENABLE_TERRAFORM_APPLY=true + environment:prod only.
# Do not use pull_request_target. Fork PRs never get AWS credentials.
# Do not enable apply on push or pull_request.

name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply main stack (requires remote state + ENABLE_TERRAFORM_APPLY + prod environment)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  # Non-secret operational inputs (gitignored locally as terraform.tfvars).
  TF_VAR_api_image_uri: ${{ vars.TF_VAR_API_IMAGE_URI }}
  # Operational contact (not a credential); secret so Actions masks it in logs.
  TF_VAR_budget_notification_email: ${{ secrets.TF_VAR_BUDGET_NOTIFICATION_EMAIL }}
  TF_VAR_terraform_state_bucket_arn: ${{ vars.TF_VAR_TERRAFORM_STATE_BUCKET_ARN }}
  TF_VAR_terraform_state_bucket_name: ${{ vars.TF_VAR_TERRAFORM_STATE_BUCKET_NAME }}
  TF_VAR_terraform_state_key: ${{ vars.TF_VAR_TERRAFORM_STATE_KEY }}

jobs:
  fmt-validate:
    name: terraform-fmt-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Fmt / init / validate (no AWS)
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    needs: [fmt-validate]
    # Skip parallel plan only when the gated apply job will actually run
    # (avoids S3 lock contention). If apply input is true but the gate is off,
    # still run plan so fmt/validate/plan remain available.
    if: >
      vars.TERRAFORM_REMOTE_STATE_READY == 'true' &&
      vars.AWS_PLAN_ROLE_ARN != '' &&
      !(github.event_name == 'workflow_dispatch' &&
        inputs.apply == true &&
        vars.ENABLE_TERRAFORM_APPLY == 'true') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Prove plan-role OIDC assumption
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws sts get-caller-identity --query Arn --output text | grep -q 'assumed-role/cloudops-prod-github-plan/'
      - name: Init / plan against remote state
        run: |
          set -euo pipefail
          test -n "${TF_VAR_api_image_uri:-}"
          test -n "${TF_VAR_budget_notification_email:-}"
          test -n "${TF_VAR_terraform_state_bucket_arn:-}"
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -no-color -lock=true

  apply:
    name: terraform-apply
    runs-on: ubuntu-latest
    needs: [fmt-validate]
    # Triple gate: explicit dispatch input + repo variable + production environment.
    # Never runs on push/PR. Same-job plan must be 0/0/0 or apply is refused.
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.apply == true &&
      vars.ENABLE_TERRAFORM_APPLY == 'true' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.TERRAFORM_REMOTE_STATE_READY == 'true'
    environment: prod
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Prove deploy-role OIDC assumption
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws sts get-caller-identity --query Arn --output text | grep -q 'assumed-role/cloudops-prod-github-deploy/'
      - name: Controlled same-job no-op plan and apply
        run: |
          set -euo pipefail
          test -n "${TF_VAR_api_image_uri:-}"
          test -n "${TF_VAR_budget_notification_email:-}"
          test -n "${TF_VAR_terraform_state_bucket_arn:-}"
          terraform version
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate

          set +e
          terraform plan -input=false -no-color -lock=true -out=tfplan -detailed-exitcode
          plan_rc=$?
          set -e

          if [ "$plan_rc" -eq 1 ]; then
            echo "terraform plan failed"
            exit 1
          fi
          if [ "$plan_rc" -eq 2 ]; then
            echo "Refusing apply: newly generated plan is not a no-op (expected 0 add / 0 change / 0 destroy)"
            terraform show -no-color tfplan | tail -n 100
            rm -f tfplan
            exit 1
          fi

          echo "Same-job plan is no-op (0 add / 0 change / 0 destroy)"
          terraform show -no-color tfplan | grep -E 'No changes\.|Plan:' || true

          # Apply the exact tfplan from this job (non-interactive; not -auto-approve on a fresh plan).
          terraform apply -input=false tfplan
          echo "Apply completed successfully"
          rm -f tfplan
