# Draft: GitHub Terraform plan (Phase 16B — enable after remote state migration)
#
# APPLY REMAINS DISABLED until remote S3 state + lockfile are proven.
# This file is the intended delivery shape; do not set ENABLE_TERRAFORM_APPLY=true yet.

name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply main stack (requires remote state + ENABLE_TERRAFORM_APPLY)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    # Disabled until Phase 16B remote-state migration sets this variable.
    if: vars.TERRAFORM_REMOTE_STATE_READY == 'true' && vars.AWS_PLAN_ROLE_ARN != ''
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Fmt / init / validate / plan
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate
          terraform plan -input=false -no-color -out=tfplan-ci
        # Do not upload tfplan artifacts containing sensitive values to public forks.

  apply:
    name: terraform-apply
    runs-on: ubuntu-latest
    needs: [plan]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.apply == true &&
      vars.ENABLE_TERRAFORM_APPLY == 'true' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: prod
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Apply is still intentionally blocked in Phase 16A
        run: |
          echo "Remote-state migration and ENABLE_TERRAFORM_APPLY must be completed in Phase 16B."
          exit 1
