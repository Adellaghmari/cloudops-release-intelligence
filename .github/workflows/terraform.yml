# Terraform preview and zero-drift verification only.
# Production release apply is owned exclusively by cd.yml.

name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/ci/terraform-plan-guard.py"
      - "scripts/ci/test_terraform_plan_guard.py"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/ci/terraform-plan-guard.py"
      - "scripts/ci/test_terraform_plan_guard.py"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_api_image_uri: ${{ vars.TF_VAR_API_IMAGE_URI }}
  TF_VAR_budget_notification_email: ${{ secrets.TF_VAR_BUDGET_NOTIFICATION_EMAIL }}
  TF_VAR_terraform_state_bucket_arn: ${{ vars.TF_VAR_TERRAFORM_STATE_BUCKET_ARN }}
  TF_VAR_terraform_state_bucket_name: ${{ vars.TF_VAR_TERRAFORM_STATE_BUCKET_NAME }}
  TF_VAR_terraform_state_key: ${{ vars.TF_VAR_TERRAFORM_STATE_KEY }}

jobs:
  fmt-validate:
    name: terraform-fmt-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Format and validate without AWS
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Test release plan guard
        working-directory: .
        run: python3 -m unittest scripts/ci/test_terraform_plan_guard.py

  plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    needs: [fmt-validate]
    if: >
      vars.TERRAFORM_REMOTE_STATE_READY == 'true' &&
      vars.AWS_PLAN_ROLE_ARN != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Prove plan role identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text \
            | grep -q 'assumed-role/cloudops-prod-github-plan/'
      - name: Initialize and validate
        run: |
          set -euo pipefail
          test -n "${TF_VAR_api_image_uri:-}"
          test -n "${TF_VAR_budget_notification_email:-}"
          test -n "${TF_VAR_terraform_state_bucket_arn:-}"
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate
      - name: Preview pull request or main changes
        if: github.event_name != 'workflow_dispatch'
        run: terraform plan -input=false -no-color -lock=true
      - name: Require zero drift
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          set +e
          terraform plan -input=false -no-color -lock=true -detailed-exitcode
          plan_rc=$?
          set -e
          if [ "$plan_rc" -eq 2 ]; then
            echo "Terraform drift detected"
            exit 1
          fi
          exit "$plan_rc"
