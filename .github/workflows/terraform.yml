# GitHub Terraform plan/apply — gated until remote state is ready.
#
# APPLY remains DISABLED unless ENABLE_TERRAFORM_APPLY=true AND workflow_dispatch.
# Do not use pull_request_target. Fork PRs never get AWS credentials.

name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply main stack (requires remote state + ENABLE_TERRAFORM_APPLY)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  # Non-secret operational inputs (gitignored locally as terraform.tfvars).
  TF_VAR_api_image_uri: ${{ vars.TF_VAR_API_IMAGE_URI }}
  # Operational contact (not a credential); secret so Actions masks it in logs.
  TF_VAR_budget_notification_email: ${{ secrets.TF_VAR_BUDGET_NOTIFICATION_EMAIL }}
  TF_VAR_terraform_state_bucket_arn: ${{ vars.TF_VAR_TERRAFORM_STATE_BUCKET_ARN }}
  TF_VAR_terraform_state_bucket_name: ${{ vars.TF_VAR_TERRAFORM_STATE_BUCKET_NAME }}
  TF_VAR_terraform_state_key: ${{ vars.TF_VAR_TERRAFORM_STATE_KEY }}

jobs:
  fmt-validate:
    name: terraform-fmt-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Fmt / init / validate (no AWS)
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    needs: [fmt-validate]
    # Remote state ready + plan role + never give AWS creds to fork PR code.
    if: >
      vars.TERRAFORM_REMOTE_STATE_READY == 'true' &&
      vars.AWS_PLAN_ROLE_ARN != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Prove plan-role OIDC assumption
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws sts get-caller-identity --query Arn --output text | grep -q 'assumed-role/cloudops-prod-github-plan/'
      - name: Init / plan against remote state
        run: |
          set -euo pipefail
          test -n "${TF_VAR_api_image_uri:-}"
          test -n "${TF_VAR_budget_notification_email:-}"
          test -n "${TF_VAR_terraform_state_bucket_arn:-}"
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -no-color -lock=true

  apply:
    name: terraform-apply
    runs-on: ubuntu-latest
    needs: [plan]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.apply == true &&
      vars.ENABLE_TERRAFORM_APPLY == 'true' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.TERRAFORM_REMOTE_STATE_READY == 'true'
    environment: prod
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Apply remains gated
        run: |
          echo "ENABLE_TERRAFORM_APPLY is set, but Phase 16B Part 1 does not authorize apply from CI yet."
          echo "Use a later reviewed Part 2 / completion gate before production apply from GitHub."
          exit 1
