name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  go:
    name: go-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux runner identity
        run: |
          uname -a
          cat /etc/os-release
      - name: Go fmt/vet/test
        run: bash scripts/ci/check-go.sh
        # check-go.sh scopes packages to ./cmd and ./internal so frontend/node_modules is not walked.

  frontend:
    name: angular-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build

  terraform:
    name: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  security:
    name: trivy-and-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy Terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Syft SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: cloudops-sbom.spdx.json

  e2e:
    name: cypress-local
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Start API and console
        run: |
          set -euo pipefail
          go run ./cmd/api &
          (cd frontend && npx ng serve --proxy-config proxy.conf.json --host 127.0.0.1 --port 4200) &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null && curl -fsS http://127.0.0.1:4200 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "local stack did not start" >&2
          exit 1
      - run: npx cypress run
        working-directory: frontend

  linux-image:
    name: linux-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build HTTP image
        run: docker build --target http -t cloudops-api:ci .
      - name: Inspect and SIGTERM
        run: bash scripts/ci/container-inspect.sh cloudops-api:ci
      - name: Build Lambda image
        run: docker build --target lambda -t cloudops-lambda:ci .
      - name: Lambda image user
        run: |
          user="$(docker image inspect cloudops-lambda:ci --format '{{.Config.User}}')"
          echo "lambda_user=$user"
          test "$user" = "1000:1000"
      - name: Trivy HTTP image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cloudops-api:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy Lambda image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cloudops-lambda:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
